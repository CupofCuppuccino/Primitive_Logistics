<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="data:,">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#342b22; }
    #unity-canvas { display:block; width:100%; height:100%; outline:none; background:#342b22; }
    #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; background:#bba17a; color:#492d1b; font:18px sans-serif; }
    #loading strong { font-size:28px; }
    progress { width:min(70vw,360px); accent-color:#a13b20; }
    #error { max-width:600px; padding:24px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Primitive Logistics game"></canvas>
  <div id="loading"><strong>PRIMITIVE LOGISTICS</strong><span>Preparing your delivery...</span><progress id="progress" max="1" value="0"></progress><div id="error" hidden></div></div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    function showError(message) {
      error.hidden = false;
      error.textContent = message;
      loading.style.display = 'flex';
    }
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    window.addEventListener('keydown', event => {
      if (document.activeElement === canvas && ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','F1'].includes(event.code)) event.preventDefault();
    });
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => showError('The game could not load. Please refresh the page.');
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => { if (type === 'error') showError(message); else console.warn(message); }
    }, value => document.getElementById('progress').value = value).then(instance => {
      window.unityInstance = instance;
      loading.style.display = 'none';
      canvas.focus();
    }).catch(reason => showError(String(reason)));
    document.body.appendChild(loader);
  </script>
</body>
</html>
